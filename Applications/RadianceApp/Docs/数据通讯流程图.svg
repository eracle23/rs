<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="720" viewBox="0 0 980 720"><defs><style>
      .title { font: bold 20px "Microsoft YaHei","SimHei",sans-serif; fill:#111; }
      .subtitle { font: 13px "Microsoft YaHei","SimHei",sans-serif; fill:#555; }
      .zone-title { font: bold 14px "Microsoft YaHei","SimHei",sans-serif; fill:#1F4E79; }
      .box-title { font: bold 12px "Microsoft YaHei","SimHei",sans-serif; fill:#1F4E79; text-anchor:middle; }
      .box-text { font: 11px "Microsoft YaHei","SimHei",sans-serif; fill:#333; text-anchor:middle; }
      .box-text-left { font: 11px "Microsoft YaHei","SimHei",sans-serif; fill:#333; }
      .arrow-label { font: 10px "Microsoft YaHei","SimHei",sans-serif; fill:#2F5597; }
      .note { font: 10px "Microsoft YaHei","SimHei",sans-serif; fill:#666; }
      .zone { fill:#F8FAFC; stroke:#1F4E79; stroke-width:1.6; }
      .app-zone { fill:#EEF4FB; stroke:#2E75B6; stroke-width:2; }
      .box { fill:#FFFFFF; stroke:#2F5597; stroke-width:1.2; }
      .box-accent { fill:#D6E4F0; stroke:#2F5597; stroke-width:1.2; }
      .box-core { fill:#4472C4; stroke:#1F4E79; stroke-width:1.2; }
      .box-core-text { font: bold 12px "Microsoft YaHei","SimHei",sans-serif; fill:#fff; text-anchor:middle; }
      .store { fill:#FFF2CC; stroke:#BF8F00; stroke-width:1.2; }
      .source { fill:#E2F0D9; stroke:#548235; stroke-width:1.2; }
      .arrow { stroke:#2F5597; stroke-width:1.4; fill:none; marker-end:url(#arrowhead); }
      .arrow-dashed { stroke:#7F7F7F; stroke-width:1.2; fill:none; stroke-dasharray:5 4; marker-end:url(#arrowhead-gray); }
    </style><marker id="arrowhead" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2F5597" /></marker><marker id="arrowhead-gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7F7F7F" /></marker></defs><text x="490.0" y="34" class="title" text-anchor="middle">图2  数据通讯流程图</text><text x="490.0" y="56" class="subtitle" text-anchor="middle">医学影像三维重建软件（Vision Magic Ecosystem）— 单机本地数据通讯与存储</text><rect x="40" y="78" width="900" height="590" rx="6" class="zone" /><text x="68" y="102" class="zone-title">单机工作站运行环境（无需外部网络连接）</text><rect x="68" y="130" width="190" height="220" rx="6" class="source" /><text x="163" y="154" class="box-title">本地数据源</text><text x="163" y="182" class="box-text">DICOM 文件夹 / .dcm</text><text x="163" y="204" class="box-text">影像文件 .nrrd / .nii</text><text x="163" y="226" class="box-text">已保存场景 .mrml / .mrb</text><text x="163" y="256" class="box-text">（用户本地磁盘选择）</text><rect x="290" y="118" width="420" height="420" rx="6" class="app-zone" /><text x="500" y="142" class="zone-title" text-anchor="middle">应用软件 VisionMagicEcosystem.exe</text><rect x="320" y="162" width="150" height="78" rx="6" class="box-accent" /><text x="395" y="184" class="box-title">启动与身份鉴别</text><text x="395" y="206" class="box-text">qLoginDialog</text><text x="395" y="226" class="box-text">UserManager</text><rect x="500" y="162" width="180" height="78" rx="6" class="box-accent" /><text x="590" y="184" class="box-title">DICOM / 数据导入</text><text x="590" y="206" class="box-text">DICOM 模块 / 添加数据</text><text x="590" y="226" class="box-text">VolumeImportValidator</text><rect x="350" y="270" width="300" height="88" rx="6" class="box-core" /><text x="500" y="302" class="box-core-text">MRML 场景 / 内存数据处理</text><text x="500" y="324" class="box-core-text">2D·3D 浏览 · 分割 · 标注 · 测量</text><rect x="320" y="386" width="110" height="56" rx="6" class="box" /><text x="375" y="410" class="box-title">三维重建</text><text x="375" y="430" class="box-text">体绘制/模型</text><rect x="445" y="386" width="110" height="56" rx="6" class="box" /><text x="500" y="410" class="box-title">医生批注</text><text x="500" y="430" class="box-text">场景保存</text><rect x="570" y="386" width="110" height="56" rx="6" class="box" /><text x="625" y="410" class="box-title">成果导出</text><text x="625" y="430" class="box-text">本地文件</text><rect x="350" y="468" width="300" height="52" rx="6" class="box-accent" /><text x="500" y="490" class="box-title">审计日志 AppLogger</text><text x="500" y="510" class="box-text">记录启动/退出、用户操作与错误信息</text><rect x="740" y="130" width="180" height="340" rx="6" class="store" /><text x="830" y="154" class="box-title">本地存储</text><text x="830" y="182" class="box-text">users.db</text><text x="830" y="202" class="box-text">（SQLite 用户库）</text><text x="830" y="232" class="box-text">DICOMDatabase/</text><text x="830" y="252" class="box-text">（本地 DICOM 索引）</text><text x="830" y="282" class="box-text">logs/VisionMagic_*.log</text><text x="830" y="302" class="box-text">（审计日志）</text><text x="830" y="332" class="box-text">保存场景/导出结果</text><text x="830" y="352" class="box-text">（.mrml/.mrb 等）</text><line x1="258" y1="220" x2="500" y2="201" class="arrow" /><text x="330" y="208" class="arrow-label">本地文件读取</text><polyline points="258,260 290,260 290,201" class="arrow-dashed" /><text x="272" y="248" class="arrow-label">加载场景</text><line x1="395" y1="240" x2="740" y2="190" class="arrow" /><text x="540" y="178" class="arrow-label">账户校验 / 读写</text><line x1="590" y1="240" x2="590" y2="270" class="arrow" /><line x1="590" y1="270" x2="500" y2="270" class="arrow" /><line x1="500" y1="358" x2="375" y2="386" class="arrow" /><line x1="500" y1="358" x2="500" y2="386" class="arrow" /><line x1="500" y1="358" x2="625" y2="386" class="arrow" /><line x1="625" y1="442" x2="740" y2="360" class="arrow" /><text x="680" y="392" class="arrow-label">写入本地</text><line x1="500" y1="442" x2="500" y2="468" class="arrow" /><line x1="395" y1="240" x2="395" y2="492" class="arrow" /><polyline points="395,492 350,492" class="arrow" /><line x1="740" y1="430" x2="650" y2="492" class="arrow" /><polyline points="650,492 500,492" class="arrow" /><line x1="650" y1="314" x2="740" y2="250" class="arrow" /><text x="688" y="272" class="arrow-label">索引/缓存</text><text x="60" y="690" class="note">说明：本软件以单机本地运行为主；数据导入、处理、保存均在用户工作站内完成，正常运行不依赖外部网络传输。</text><text x="60" y="708" class="note">可选：按部署策略启用授权/许可校验；DICOM 网络接收非默认必需功能。</text></svg>