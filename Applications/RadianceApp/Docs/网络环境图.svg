<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="780" viewBox="0 0 980 780"><defs><style>
      .title { font: bold 20px "Microsoft YaHei","SimHei",sans-serif; fill:#111; }
      .subtitle { font: 13px "Microsoft YaHei","SimHei",sans-serif; fill:#555; }
      .zone-title { font: bold 13px "Microsoft YaHei","SimHei",sans-serif; fill:#1F4E79; }
      .box-title { font: bold 12px "Microsoft YaHei","SimHei",sans-serif; fill:#1F4E79; text-anchor:middle; }
      .box-text { font: 11px "Microsoft YaHei","SimHei",sans-serif; fill:#333; text-anchor:middle; }
      .note-title { font: bold 11px "Microsoft YaHei","SimHei",sans-serif; fill:#444; }
      .note { font: 10px "Microsoft YaHei","SimHei",sans-serif; fill:#555; }
      .legend { font: 10px "Microsoft YaHei","SimHei",sans-serif; fill:#2F5597; }
      .legend-gray { font: 10px "Microsoft YaHei","SimHei",sans-serif; fill:#777; }
      .pc-zone { fill:#EEF4FB; stroke:#2E75B6; stroke-width:2; }
      .outer-zone { fill:#F8FAFC; stroke:#1F4E79; stroke-width:1.6; }
      .note-zone { fill:#F5F5F5; stroke:#BBBBBB; stroke-width:1; }
      .app-box { fill:#4472C4; stroke:#1F4E79; stroke-width:1.4; }
      .app-text { font: bold 12px "Microsoft YaHei","SimHei",sans-serif; fill:#fff; text-anchor:middle; }
      .sub-box { fill:#FFFFFF; stroke:#2F5597; stroke-width:1.2; }
      .store-box { fill:#FFF2CC; stroke:#BF8F00; stroke-width:1.2; }
      .user-box { fill:#E2F0D9; stroke:#548235; stroke-width:1.2; }
      .media-box { fill:#EDEDED; stroke:#666666; stroke-width:1.2; }
      .sec-box { fill:#FCE4D6; stroke:#C55A11; stroke-width:1.2; }
      .arrow { stroke:#2F5597; stroke-width:1.5; fill:none; marker-end:url(#arrowhead); }
      .arrow-gray { stroke:#888888; stroke-width:1.2; fill:none; stroke-dasharray:6 4; marker-end:url(#arrowhead-gray); }
    </style><marker id="arrowhead" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2F5597" /></marker><marker id="arrowhead-gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#888888" /></marker></defs><text x="490.0" y="32" class="title" text-anchor="middle">图1  网络环境图</text><text x="490.0" y="54" class="subtitle" text-anchor="middle">医学影像三维重建软件（Vision Magic Ecosystem）— 单机部署网络环境</text><rect x="420" y="72" width="140" height="52" rx="8" class="user-box" /><text x="490" y="92" class="box-title">操作者</text><text x="490" y="110" class="box-text">临床/技术人员</text><rect x="430" y="136" width="120" height="26" rx="4" class="sub-box" /><text x="490" y="153" class="box-text">显示与输入设备</text><line x1="490" y1="124" x2="490" y2="136" class="arrow" /><line x1="490" y1="162" x2="490" y2="188" class="arrow" /><rect x="100" y="188" width="780" height="330" rx="8" class="outer-zone" /><text x="116" y="208" class="zone-title">医疗机构内网 / 单机工作站部署边界（正常运行无需连接外部网络）</text><rect x="160" y="222" width="660" height="268" rx="8" class="pc-zone" /><text x="490.0" y="240" class="zone-title" text-anchor="middle">Windows 10/11 64 位 工作站</text><rect x="240" y="252" width="500" height="64" rx="8" class="app-box" /><text x="490.0" y="278" class="app-text">医学影像三维重建软件</text><text x="490.0" y="298" class="app-text">VisionMagicEcosystem.exe</text><rect x="200" y="332" width="180" height="96" rx="8" class="sub-box" /><text x="290.0" y="354" class="box-title">身份鉴别</text><text x="290.0" y="376" class="box-text">UserManager</text><text x="290.0" y="396" class="box-text">users.db</text><rect x="404" y="332" width="180" height="96" rx="8" class="store-box" /><text x="494.0" y="354" class="box-title">本地 DICOM 库</text><text x="494.0" y="376" class="box-text">DICOMDatabase/</text><text x="494.0" y="396" class="box-text">本地索引与缓存</text><rect x="608" y="332" width="180" height="96" rx="8" class="store-box" /><text x="698.0" y="354" class="box-title">审计与日志</text><text x="698.0" y="376" class="box-text">AppLogger</text><text x="698.0" y="396" class="box-text">logs/ 目录</text><rect x="240" y="442" width="500" height="42" rx="8" class="sec-box" /><text x="490.0" y="458" class="box-title">推荐：火绒等杀毒软件（与本软件共存验证）</text><text x="490.0" y="474" class="box-text">操作系统账户权限 + 物理访问控制</text><rect x="180" y="540" width="300" height="76" rx="8" class="media-box" /><text x="330.0" y="560" class="box-title">本地磁盘 / 移动存储</text><text x="330.0" y="580" class="box-text">DICOM 文件夹 · 场景文件 · 导出结果</text><text x="330.0" y="598" class="box-text">（USB / 光盘等离线介质）</text><rect x="560" y="540" width="240" height="76" rx="8" class="media-box" /><text x="680.0" y="560" class="box-title">外部网络 / PACS</text><text x="680.0" y="580" class="box-text">非默认必需</text><text x="680.0" y="598" class="box-text">（可选，按现场配置）</text><line x1="330.0" y1="540" x2="494.0" y2="490" class="arrow" /><text x="350.0" y="528" class="legend">离线导入</text><line x1="680.0" y1="540" x2="698.0" y2="332" class="arrow-gray" /><text x="570" y="528" class="legend-gray">可选连接</text><rect x="60" y="636" width="860" height="118" rx="8" class="note-zone" /><text x="76" y="658" class="note-title">说明</text><text x="76" y="680" class="note">1. 产品默认以单机方式部署于用户工作站，影像数据通过本地文件系统或离线介质导入，不依赖持续网络连接。</text><text x="76" y="700" class="note">2. 用户账户、DICOM 索引、审计日志及处理结果均存储于本机；软件无默认对外网络服务端口。</text><text x="76" y="720" class="note">3. 可按部署策略启用授权/许可校验；DICOM 网络接收为可选功能，非正常运行所必需。</text></svg>